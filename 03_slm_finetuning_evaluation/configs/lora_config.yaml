model_name: microsoft/Phi-3-mini-4k-instruct
output_dir: outputs/sdg_slm_lora
dataset_dir: data
train_file: train.jsonl
valid_file: valid.jsonl

training:
  max_seq_length: 1024
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00002
  warmup_steps: 5
  logging_steps: 5
  save_steps: 50

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
